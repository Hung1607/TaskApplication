spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/task
    username: postgres
    password: 1234
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate # check if match db but do nothing
      # update mean validate with the db and entity, also change the db
      # Important: 'validate' for production, 'update' for dev
    show-sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    clean-disabled: false # ignore at V1__
  kafka:
      bootstrap-servers: localhost:9092
      consumer:
        group-id: sample-consumer-group
        auto-offset-reset:  earliest
        key-deserializer:   org.apache.kafka.common.serialization.StringDeserializer
        value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
        properties:
          spring.json.value.default.type: com.example.taskadministration.dto.request.TaskRequest
          spring.json.trusted.packages: com.example.taskadministration.dto.request
          spring.json.use.type.headers: false
      producer:
        key-serializer: org.apache.kafka.common.serialization.StringSerializer
        value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

server: # listen
  port: 8080



