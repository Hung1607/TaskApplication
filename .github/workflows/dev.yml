name: Prod Pipeline

on:
  push:
    branches-ignore:
      - main
      - stage

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: build and unit test
        run: mvn clean install -Dtest="com.example.taskadministration.unit.service.*Test"