name: Staging Pipeline

on:
  push:
    branches:
      - docker-stage
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
#    environment: staging # for git hub environment

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Run Tests
        run: mvn clean test

      - name: Build Docker image
        run: docker build -t ${{ secrets.DOCKER_HUB_USERNAME }}/task-administration:latest .

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }} # have to be like this otherwise reject by git policies

      - name: Push Docker image
        run: docker push ${{ secrets.DOCKER_HUB_USERNAME }}/task-administration:latest
      - name: Deploy to Remote Server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            docker pull ${{ secrets.DOCKER_HUB_USERNAME }}/task-administration:latest
            docker stop task-app || true
            docker rm task-app || true
            docker run -d -p 8080:8080 --name task-app ${{ secrets.DOCKER_HUB_USERNAME }}/task-administration:latest