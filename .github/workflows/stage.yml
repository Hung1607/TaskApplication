name: Pipeline

on:
  push:
  pull_request:

jobs:
  build:
    environment: ${{ github.ref == 'refs/heads/dev' && 'dev' || 'stage' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build and unit test
        run: mvn clean install -Dtest="com.example.taskadministration.unit.service.*Test"

      - name: Build Docker image
        if: github.event_name == 'push'
        run: docker build -t ${{ secrets.DOCKER_HUB_USERNAME }}/task-administration:latest .

      - name: Log in to Docker Hub
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: Push Docker image
        if: github.event_name == 'push'
        run: docker push ${{ secrets.DOCKER_HUB_USERNAME }}/task-administration:latest