name: Pipeline

on:
  push:
  pull_request:

jobs:
  build:
#    environment: ${{ github.ref == 'refs/heads/dev' && 'dev' || 'stage' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build and unit test
        if: github.event_name == 'push' && github.ref != 'main'
        run: mvn clean install -Dtest="com.example.taskadministration.unit.service.*Test"


