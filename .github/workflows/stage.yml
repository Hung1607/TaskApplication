name: Staging Pipeline

on:
  push:
    branches:
      - docker-stage
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest # same as gitlab runner

    steps:
      - name: Checkout code
        uses: actions/checkout@v4  # action that retrieves repository's code

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'maven'

      - name: Run Tests
        run: mvn clean test

      - name: Build local Docker image
        run: docker build -t task-administration:latest .





