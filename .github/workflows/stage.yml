name: Staging Pipeline

on:
  push:
  pull_request:

jobs:
  build:
    environment: ${{ github.ref_name == 'dev' && 'dev' || 'stage' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: build and unit test
        if: github.event_name == 'push' && github.ref_name != 'main' && github.ref_name != 'stage'
        run: mvn clean install -Dtest="com.example.taskadministration.unit.service.*Test"

      - name: build and integration test
        if: github.event_name == 'pull_request' && github.base_ref == 'stage'
        run: mvn clean install -Dtest="com.example.taskadministration.unit.service.*Test"

      - name: sonarqube
        run: echo "imagine there is since sonarqube now can be pushed to by jenkins"

